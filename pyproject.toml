[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptstyler-next"
version = "0.4.1"
description = "Deterministic, model-aware creative styling for Python, ComfyUI and HEISS Studio"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "STYLE-LICENSE"]
authors = [{name = "NidAll"}]
keywords = ["comfyui", "prompt", "styling", "image-generation"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Typing :: Typed"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1,<2", "jsonschema>=4,<5", "coverage>=7,<8"]

[project.scripts]
promptstyler-next = "promptstyler_next.cli:main"

[tool.setuptools.packages.find]
include = ["promptstyler_next*"]

[tool.setuptools.package-data]
promptstyler_next = ["py.typed", "profiles.json", "packs/*.json", "schemas/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["comfyui/upscaler/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = ["promptstyler_next"]

[tool.coverage.run]
source = ["promptstyler_next"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", "raise NotImplementedError"]
